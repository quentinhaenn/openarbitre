[package]
name = "arbitre"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
arbitre-core = { version = "0.1.0", path = "../core" }
arbitre-sqlite = { version = "0.1.0", path = "../sqlite" }
clap = { version = "4.6.7", features = ["string"] }
# System time zone for the native clock (ST-04 plan P-12).
jiff = { workspace = true, features = ["std", "tz-system"] }

[dev-dependencies]
# `ready` (single-poll store futures) is behind `sim`.
arbitre-core = { version = "0.1.0", path = "../core", features = ["sim"] }
# Independent JSON parser for acceptance tests (ST-03 plan P-2).
serde_json = { workspace = true }

[features]
# Test module `test` (crates/cli/src/wiring/test.rs); never shipped (ST-03 plan P-9).
test-actions = []

# Acceptance tests spawning the binary with the test module: run with --all-features.
[[test]]
name = "usage"
required-features = ["test-actions"]

[[test]]
name = "output"
required-features = ["test-actions"]

[[test]]
name = "codes"
required-features = ["test-actions"]

[[test]]
name = "location"
required-features = ["test-actions"]

[[test]]
name = "modules"
required-features = ["test-actions"]

[[test]]
name = "signals"
required-features = ["test-actions"]

[[test]]
name = "network"
required-features = ["test-actions"]

[[test]]
name = "conformance"
required-features = ["test-actions"]
