[package]
name = "arbitre-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Time zones, bundled database, no std (ST-04 plan, `jiff` check).
jiff = { workspace = true, features = ["alloc", "tzdb-bundle-always"] }

[dev-dependencies]
proptest = { workspace = true }
# Independent JSON parser for ST-03 tests only (plan P-2).
serde_json = { workspace = true }

[features]
# SimClock (clock.rs), for tests and simulated devices.
sim = []

# Tests using SimClock: run with --all-features (CI: 10-st01-tests.sh).
[[test]]
name = "hlc"
required-features = ["sim"]

[[test]]
name = "convergence"
required-features = ["sim"]

[[test]]
name = "store"
required-features = ["sim"]

[[test]]
name = "module"
required-features = ["sim"]

[[test]]
name = "timezone"
required-features = ["sim"]

[[test]]
name = "signal"
required-features = ["sim"]
