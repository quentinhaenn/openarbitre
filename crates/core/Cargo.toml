[package]
name = "arbitre-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dev-dependencies]
proptest = { workspace = true }

[features]
# HorlogeSimulee (clock.rs), pour les tests et les appareils simulés.
sim = []

# Tests qui utilisent HorlogeSimulee : lancer avec --all-features (CI : 10-st01-tests.sh).
[[test]]
name = "hlc"
required-features = ["sim"]

[[test]]
name = "convergence"
required-features = ["sim"]
