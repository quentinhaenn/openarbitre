[package]
name = "arbitre-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dev-dependencies]
proptest = { workspace = true }

[features]
# SimClock (clock.rs), for tests and simulated devices.
sim = []

# Tests using SimClock: run with --all-features (CI: 10-st01-tests.sh).
[[test]]
name = "hlc"
required-features = ["sim"]

[[test]]
name = "convergence"
required-features = ["sim"]

[[test]]
name = "store"
required-features = ["sim"]
