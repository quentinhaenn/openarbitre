[package]
name = "s5-mcp"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone throwaway crate: not a workspace member.
[workspace]

[dependencies]
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "io-std"] }
serde_json = "1.0.154"

[features]
default = ["local"]
# Without it rmcp requires `Send + Sync` handlers and `Send` futures (probe: --no-default-features).
local = ["rmcp/local"]
