[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"

# Shared dependencies: docs/decisions/ST-01-dependencies.md (amendment A-5 of the ST-01 plan).
[workspace.dependencies]
serde_json = "1.0.154"
proptest = "1.12.0"
jiff = { version = "0.2.39", default-features = false }
getrandom = { version = "0.4.3", default-features = false }
