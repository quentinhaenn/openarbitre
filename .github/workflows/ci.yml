# Verification of every PR: one job, calling scripts/ci.sh (ST-01 design, CI; T-11).
# Actions pinned by commit SHA (public repository); original tag in the comment.
name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Toolchain, components and target of rust-toolchain.toml.
      - name: toolchain
        run: rustup toolchain install
      # full_match requires Python >= 3.13 (Q-2).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: tool versions
        id: tools
        run: |
          . scripts/tools.env
          echo "tool=cargo-mutants@${CARGO_MUTANTS_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: ${{ steps.tools.outputs.tool }}
      # gitleaks is not supported by install-action: official binary, checksum verified.
      - name: gitleaks
        run: |
          . scripts/tools.env
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256_LINUX_X64}  $f" | sha256sum -c -
          tar -xzf "$f" -C "$HOME/.cargo/bin" gitleaks
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: scripts/ci.sh
        run: scripts/ci.sh
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci
          path: target/ci/
