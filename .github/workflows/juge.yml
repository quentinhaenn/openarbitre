# Juge : exécute le code de main seulement, lit la PR comme données (A-8, T-11).
# Ne jamais extraire la tête de la PR : pull_request_target (R-11)
name: juge
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  juge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # full_match exige Python ≥ 3.13 (Q-2).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: tête de la PR dans la base d'objets seulement
        run: git fetch origin "refs/pull/$NUMERO/head"
        env:
          NUMERO: ${{ github.event.pull_request.number }}
      - name: scripts/lib/juge.py
        run: python3 scripts/lib/juge.py "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          CI_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
